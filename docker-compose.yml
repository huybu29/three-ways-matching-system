version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: twm-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-three_way_matching}
      POSTGRES_USER: ${POSTGRES_USER:-twm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-twm_secret_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-twm_admin} -d ${POSTGRES_DB:-three_way_matching}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: twm-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-twm_redis_2026}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-twm_redis_2026}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: