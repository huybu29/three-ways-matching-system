name: Monorepo CI Gate

on:
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  backend-verify:
    name: Backend Build & Concurrency Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: three_way_matching_test
          POSTGRES_USER: twm_admin
          POSTGRES_PASSWORD: twm_secret_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run Maven Verify
        working-directory: ./backend
        run: ./mvnw clean test -B

  frontend-verify:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install & Build
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint
          npm run build